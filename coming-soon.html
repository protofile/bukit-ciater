<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Coming Soon - Bukit Ciater Resort & Spa</title>
    <link rel="stylesheet" href="assets/css/output.css">
    <style>
        html,
        body {
            height: 100%;
            margin: 0
        }

        .cs-hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('assets/images/bank/hero-1.jpg');
            background-size: cover;
            background-position: center;
        }

        .cs-panel {
            background: rgba(0, 0, 0, 0.48);
            color: #fff;
            padding: 3rem 2rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(2, 6, 23, 0.6);
            max-width: 960px;
            width: calc(100% - 3rem);
        }

        .cs-logo {
            display: block;
            width: 160px;
            height: auto;
            margin: 0 auto 1rem;
        }

        .cs-panel h1 {
            font-size: 48px;
            margin: 0 0 1rem
        }

        .cs-panel p {
            font-size: 18px;
            margin: 0
        }

        @media (max-width:640px) {
            .cs-panel {
                padding: 2rem
            }

            .cs-panel h1 {
                font-size: 32px
            }

            .cs-logo {
                width: 120px
            }
        }
    </style>
</head>

<body>
    <main class="cs-hero">
        <div class="cs-panel">
            <img src="assets/images/bukit-ciater-resort-and-spa-logo.png" alt="Bukit Ciater Logo" class="cs-logo">
            <h1>Coming Soon</h1>
            <p>Bukit Ciater Resort & Spa will have big updates. Wait! We are launching soon with amazing updates.</p>
        </div>
    </main>
</body>

</html>
